services:
  db:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockanalyzer}
      POSTGRES_USER: ${POSTGRES_USER:-stockapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  app:
    init: true
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-development}
    image: stock-graph-analyzer:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      AUTH_SESSION_MINUTES: ${AUTH_SESSION_MINUTES:-60}
      AUTH_MAX_FAILURES: ${AUTH_MAX_FAILURES:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      XDG_CACHE_HOME: /tmp/.cache
      STOCKANALYZER_REPLAY_DIR: /var/lib/stockanalyzer/replay
      FINNHUB_KEY: ${FINNHUB_KEY:-}
      TWELVEDATA_KEY: ${TWELVEDATA_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      - ./legacy:/legacy:ro
      - replay_data:/var/lib/stockanalyzer/replay
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/stockapp/.streamlit:rw,noexec,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - database
      - egress
      - grabbit_net
  radar-worker:
    init: true
    image: stock-graph-analyzer:local
    restart: unless-stopped
    command: ["python", "-m", "stockanalyzer.radar_worker"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      FINNHUB_KEY: ${FINNHUB_KEY:-}
      TWELVEDATA_KEY: ${TWELVEDATA_KEY:-}
      RADAR_WORKER_INTERVAL_SECONDS: ${RADAR_WORKER_INTERVAL_SECONDS:-30}
      RADAR_WORKER_HEARTBEAT: /tmp/radar-worker-heartbeat
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - ./legacy:/legacy:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - database
      - egress
    healthcheck:
      test: ["CMD", "python", "-m", "stockanalyzer.worker_health", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  database:
    internal: true
  egress: {}
  grabbit_net:
        name: affiliate-platform_frontend
        external: true
volumes:
  postgres_data: {}
  replay_data: {}
